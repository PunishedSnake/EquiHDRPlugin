name: Build native D3D11 hook

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-native-hook.yml"
      - "native-hook/**"

permissions:
  contents: write

jobs:
  build-hook:
    # node-gyp 11 does not yet reliably discover the VS 2026 image used by
    # windows-latest, so keep this on the mature VS 2022 toolchain.
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch pinned MinHook
        shell: pwsh
        run: |
          git clone --depth 1 --branch v1.3.4 https://github.com/TsudaKageyu/minhook.git native-hook/minhook

      - name: Apply Windows SDK C-interface compatibility fix
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $path = "native-hook/hook.cpp"
          $source = Get-Content $path -Raw

          # With CINTERFACE enabled, the Windows SDK's optional C++ D3D11 helper
          # classes try to call methods that deliberately no longer exist on the
          # C-style COM structs. Suppress those helpers explicitly.
          if (-not $source.Contains("#define D3D11_NO_HELPERS")) {
            $source = $source.Replace(
              "#define CINTERFACE",
              "#define D3D11_NO_HELPERS`r`n#define CINTERFACE"
            )
          }

          # __uuidof is unavailable for the CINTERFACE typedefs. The SDK exposes
          # the same interface IDs as normal IID_* constants.
          $source = $source.Replace("__uuidof(ID3D11Texture2D)", "IID_ID3D11Texture2D")
          $source = $source.Replace("__uuidof(ID3D11VideoContext)", "IID_ID3D11VideoContext")

          Set-Content -Path $path -Value $source -NoNewline

      - name: Install native addon dependencies
        working-directory: native-hook
        run: npm install --ignore-scripts

      - name: Build native addon
        working-directory: native-hook
        env:
          GYP_MSVS_VERSION: "2022"
        run: npm run build

      - name: Prepare release assets
        shell: pwsh
        run: |
          Copy-Item native-hook/build/Release/equihdr_hook.node ./equihdr_hook.node
          Copy-Item native-hook/minhook/LICENSE.txt ./MinHook-LICENSE.txt
          $hash = (Get-FileHash .\equihdr_hook.node -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  equihdr_hook.node" | Set-Content .\equihdr_hook.node.sha256 -NoNewline

      - name: Publish hook release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view hook-latest --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create hook-latest `
              --repo "$env:GITHUB_REPOSITORY" `
              --target "$env:GITHUB_SHA" `
              --title "EquiHDR native D3D11 hook" `
              --notes "In-process D3D11 VideoProcessorBlt hook with configurable FP16/scRGB tone mapping for Discord Go Live." `
              --latest=false
          }

          gh release upload hook-latest `
            .\equihdr_hook.node `
            .\equihdr_hook.node.sha256 `
            .\MinHook-LICENSE.txt `
            --repo "$env:GITHUB_REPOSITORY" `
            --clobber
